# 启用 BBR 拥塞控制
#
# 背景：本固件原先通过 luci-app-turboacc 设置 BBR，但 turboacc 同时会开启流量卸载
# （flow offload / SFE / fullcone），而流量卸载会让首包之后的流量绕过 netfilter，
# 与 Open-Box 的 TUN 代理冲突（表现为部分站点偶发卡死）。因此移除 turboacc，
# 只保留 BBR——它对 PPPoE 这类有丢包的长肥管道有明显收益。
#
# kmod-tcp-bbr 由 custom-packages.sh 显式加入包列表，确保 tcp_bbr 模块存在。
net.ipv4.tcp_congestion_control=bbr
