name: Auto-R4S Build (reusable)

on:
  workflow_call:
    inputs:
      series:
        required: true
        type: string          # 24.10 | 25.12
      luci_version:
        required: true
        type: string
      profile:
        required: true
        type: string
        default: 'friendlyarm_nanopi-r4s'
      custom_router_ip:
        required: true
        type: string
        default: "192.168.1.1"
      rootfs_partsize:
        required: true
        type: string
        default: '3G'
      include_docker:
        required: true
        type: string
        default: 'yes'
      enable_pppoe:
        required: true
        type: string
        default: 'no'
      pppoe_account:
        required: false
        type: string
        default: ""
      pppoe_password:
        required: false
        type: string
        default: ""
      enable_openbox:
        required: false
        type: string
        default: 'yes'
      pkg_ext:
        required: true
        type: string          # ipk | apk
      image_tag_suffix:
        required: true
        type: string          # 24.10 | 25.12
      config_file:
        required: true
        type: string          # imm.config | imm25.config
      custom_pkgs_file:
        required: true
        type: string          # custom-packages.sh | apk-custom-packages.sh
      thirdparty_feed:
        required: true
        type: string          # 24.10 | 25.12（down.dllkids.xyz 路径片段）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/rockchip/build.sh

      - name: Save custom router IP
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          printf '%s' "${{ inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "管理地址: ${{ inputs.custom_router_ip }}"

      - name: Validate PPPoE inputs
        run: |
          if [ "${{ inputs.enable_pppoe }}" = "yes" ]; then
            if [ -z "${{ inputs.pppoe_account }}" ] || [ -z "${{ inputs.pppoe_password }}" ]; then
              echo "::error::启用 PPPoE 时必须填写宽带账号与密码"
              exit 1
            fi
            pw="${{ inputs.pppoe_password }}"
            if [ "$pw" = "123456" ] || [ "${#pw}" -lt 6 ]; then
              echo "::error::PPPoE 密码过弱（禁止 123456 / 长度<6），请更换后再构建"
              exit 1
            fi
          fi

      - name: Fetch third-party packages (pushbot / accesscontrol / openlist2)
        run: |
          set +e
          mkdir -p "${{ github.workspace }}/shell/pushbot" "${{ github.workspace }}/shell/accesscontrol" "${{ github.workspace }}/shell/openlist2"
          base="https://down.dllkids.xyz/openwrt-feed/${{ inputs.thirdparty_feed }}/aarch64_generic"
          echo "第三方 feed: $base"

          # 动态拉取目录索引，按模式匹配最新文件名（避免版本写死导致 404）
          if ! index=$(curl -fsSL --max-time 30 "$base/" 2>/dev/null); then
            echo "::warning::无法获取第三方 feed 目录索引，跳过所有第三方包"
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES"' >> shell/${{ inputs.custom_pkgs_file }}
            exit 0
          fi

          # 从索引中匹配某个包的最新文件名；patterns 命中其一，exclude 排除变体
          resolve() {
            local patterns="$1" exclude="$2" f
            f=$(printf '%s\n' "$index" | grep -oiE '[A-Za-z0-9._~-]+\.(ipk|apk)' \
                | grep -E "$patterns" | grep -vE "${exclude:-^$}" | sort -V | tail -n1)
            [ -n "$f" ] && { echo "$f"; return 0; }
            return 1
          }

          # 下载到指定子目录；成功返回 0，失败仅告警不中断
          download() {
            local name="$1" destdir="$2"
            echo "下载 $name ..."
            if curl -fsSL --max-time 60 -o "${{ github.workspace }}/shell/$destdir/$name" "$base/$name"; then
              if [ -s "${{ github.workspace }}/shell/$destdir/$name" ]; then
                echo "✅ $name"; return 0
              fi
              echo "::warning::$name 下载为空，跳过"; rm -f "${{ github.workspace }}/shell/$destdir/$name"; return 1
            fi
            echo "::warning::$name 下载失败，跳过"; return 1
          }

          ok_pushbot=0
          p=$(resolve 'luci-app-pushbot[._-]' '') && download "$p" pushbot && ok_pushbot=1

          ok_ac=0
          a=$(resolve 'luci-app-accesscontrol[._-]' 'plus') && download "$a" accesscontrol && ok_ac=1

          ok_ol_app=0
          o=$(resolve 'luci-app-openlist2[._-]' '') && download "$o" openlist2 && ok_ol_app=1

          ok_ol_daemon=0
          d=$(resolve 'openlist2[._-]4\.' 'luci-app-openlist2') && download "$d" openlist2 && ok_ol_daemon=1

          pkgs=""
          [ "$ok_pushbot" = 1 ] && pkgs="$pkgs luci-app-pushbot bash curl jq smartmontools iputils-arping"
          [ "$ok_ac" = 1 ] && pkgs="$pkgs luci-app-accesscontrol"
          if [ "$ok_ol_app" = 1 ] && [ "$ok_ol_daemon" = 1 ]; then
            pkgs="$pkgs luci-app-openlist2 openlist2"
          elif [ "$ok_ol_app" = 1 ] || [ "$ok_ol_daemon" = 1 ]; then
            echo "::warning::openlist2 仅下载到部分组件（app=$ok_ol_app daemon=$ok_ol_daemon），为避免构建失败暂不集成 openlist2"
          fi

          echo "CUSTOM_PACKAGES=\"\$CUSTOM_PACKAGES$pkgs\"" >> shell/${{ inputs.custom_pkgs_file }}
          echo "✅ 第三方包处理完成（来自第三方 feed，未做内容校验，请自行评估信任）"

      - name: Build ImmortalWrt ${{ inputs.series }}
        run: |
          case "${{ inputs.rootfs_partsize }}" in
            1G) ROOTFS_SIZE=1024 ;;
            2G) ROOTFS_SIZE=2048 ;;
            3G) ROOTFS_SIZE=3072 ;;
            4G) ROOTFS_SIZE=4096 ;;
            *)  ROOTFS_SIZE=3072 ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          docker run --rm -i --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
              -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
              -v "${{ github.workspace }}/arch/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
              -v "${{ github.workspace }}/rockchip/${{ inputs.config_file }}:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/rockchip/build.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=${{ inputs.profile }} \
              -e BUILD_SERIES=${{ inputs.series }} \
              -e INCLUDE_DOCKER=${{ inputs.include_docker }} \
              -e ROOTFS_PARTSIZE=$ROOTFS_SIZE \
              -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
              -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
              -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
              -e ENABLE_OPENBOX=${{ inputs.enable_openbox }} \
          immortalwrt/imagebuilder:rockchip-armv8-openwrt-${{ inputs.luci_version }} /bin/bash /home/build/immortalwrt/build.sh

      - name: Generate package report
        run: |
          TARGET_DIR="${{ github.workspace }}/bin/targets/rockchip/armv8"
          PROFILE="${{ inputs.profile }}"
          MANIFEST_FILE=$(ls "$TARGET_DIR"/*"$PROFILE"*.manifest 2>/dev/null | head -n1)
          [ -z "$MANIFEST_FILE" ] && MANIFEST_FILE=$(ls "$TARGET_DIR"/*.manifest 2>/dev/null | head -n1)
          if [ -z "$MANIFEST_FILE" ]; then
            echo "::error::未找到 manifest 文件，构建可能失败"
            exit 1
          fi
          cp "$MANIFEST_FILE" "${{ github.workspace }}/firmware-packages.txt"
          grep -E '^(luci-app|luci-i18n|luci-theme)-' "$MANIFEST_FILE" > "${{ github.workspace }}/Plugin-list.txt" || true
          kernel_version=$(awk '/^kernel - / {print $3; exit}' "$MANIFEST_FILE")
          kernel_version_short=$(echo "$kernel_version" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          echo "KERNEL_VERSION=${kernel_version_short:-unknown}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +'%Y-%m-%d-%H%M')" >> "$GITHUB_ENV"

      - name: Create router info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息

          - ✳️ **软路由型号**: ${{ inputs.profile }}
          - 🏠 **后台地址**: ${{ inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 首次登录请务必设置强密码
          - 📦 **固件版本**: ${{ inputs.luci_version }}
          - 🧠 **内核版本**: ${KERNEL_VERSION}
          - 🐳 **Docker**: ${{ inputs.include_docker == 'yes' && '已集成' || '未集成' }}
          - 📦 **Open-Box**: ${{ inputs.enable_openbox == 'yes' && '已开启（首启自动安装）' || '已关闭' }}
          EOF

      - name: Upload release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # softprops/action-gh-release v3.0.3
        with:
          tag_name: Autobuild-${{ inputs.image_tag_suffix }}-${{ env.BUILD_DATE }}
          name: ImmortalWrt-Rockchip-${{ inputs.image_tag_suffix }}
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/rockchip/armv8/*.img.gz
            ${{ github.workspace }}/Plugin-list.txt
            ${{ github.workspace }}/firmware-packages.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
