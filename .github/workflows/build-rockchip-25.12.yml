name: Auto-R4S Build 25.12.x Rockchip

permissions:
  contents: write

# 目前此工作流可以集成 imm 仓库内软件；第三方软件暂不能集成（待开发）
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择 luci 版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
      profile:
        type: choice
        description: "软路由型号"
        options:
          - friendlyarm_nanopi-r4s
        required: true
        default: 'friendlyarm_nanopi-r4s'
      custom_router_ip:
        description: "管理地址（仅对多网口有效）格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.1.1"
      rootfs_partsize:
        description: "软件包空间大小"
        required: true
        type: choice
        default: '3G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      include_docker:
        description: "是否集成 Docker"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置 PPPoE 拨号"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_account:
        description: "宽带账号（启用 PPPoE 时必填）"
        required: false
        default: ""
      pppoe_password:
        description: "宽带密码（启用 PPPoE 时必填，禁止弱口令）"
        required: false
        default: ""
      enable_openbox:
        description: "首启是否自动安装 Open-Box 代理"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  call-build:
    uses: ./.github/workflows/build-reusable.yml
    secrets: inherit
    with:
      series: "25.12"
      luci_version: ${{ github.event.inputs.luci_version }}
      profile: ${{ github.event.inputs.profile }}
      custom_router_ip: ${{ github.event.inputs.custom_router_ip }}
      rootfs_partsize: ${{ github.event.inputs.rootfs_partsize }}
      include_docker: ${{ github.event.inputs.include_docker }}
      enable_pppoe: ${{ github.event.inputs.enable_pppoe }}
      pppoe_account: ${{ github.event.inputs.pppoe_account }}
      pppoe_password: ${{ github.event.inputs.pppoe_password }}
      enable_openbox: ${{ github.event.inputs.enable_openbox }}
      pkg_ext: "apk"
      image_tag_suffix: "25.12"
      config_file: "imm25.config"
      custom_pkgs_file: "apk-custom-packages.sh"
      thirdparty_feed: "25.12"
